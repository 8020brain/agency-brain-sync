name: Build and release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Every release runs the test suite first. The seven files under tests/ sat
  # in the repo for weeks with nothing invoking them, which is how a guard
  # written specifically against white-label leaks never caught one. A red
  # test now stops the build before anything is signed or published.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The sync-recovery test spawns the real watcher, which needs chokidar at
      # runtime, so the suite needs dependencies. --ignore-scripts skips the
      # Electron binary download the tests never use. (v1.1.21's test job ran
      # bare and died on exactly this.)
      - run: npm ci --ignore-scripts
      # The sync harness builds real git repos, commits and pushes "main".
      # Runners ship git with no global config at all: no default branch
      # (killed v1.1.22, "src refspec main does not match any") and no identity
      # (killed v1.1.23, "empty ident name"). Set the three things a dev
      # machine has. The whole suite was run locally under an empty HOME with
      # exactly these before v1.1.24 was tagged, so this is the complete list,
      # not the third guess.
      - run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@agency-brain-sync.test"
          git config --global user.name "CI"
      - run: npm test

  build:
    needs: test
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: mac
          - os: windows-latest
            script: build:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # The in-app changelog (Command Centre footer -> /changelog) renders the
      # bundled CHANGELOG.md, so a release without its entry would ship a page
      # that silently stops at the previous version. Fail the build loudly
      # instead: every release MUST add a "## <version> - <date>" section,
      # written in plain member-facing language.
      - name: Changelog entry exists for this version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          grep -q "^## ${VER} " CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${VER}. Add a member-facing entry (it renders in-app at /changelog) and re-tag."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Windows signing prep (win leg only). CodeSignTool is a Java CLI, so it
      # needs a JRE; the SSL.com Windows zip is fetched from a pinned release and
      # its folder is exported as CODE_SIGN_TOOL_DIR for the electron-builder
      # sign hook (build/win-sign.cjs) to call.
      - name: Set up Java for CodeSignTool (Windows signing)
        if: matrix.artifact == 'win'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download SSL.com CodeSignTool (Windows signing)
        if: matrix.artifact == 'win'
        shell: pwsh
        run: |
          $url = 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bat = Get-ChildItem -Path $dest -Recurse -Filter 'CodeSignTool.bat' | Select-Object -First 1
          if (-not $bat) {
            Write-Error 'CodeSignTool.bat not found in the downloaded zip'
            Get-ChildItem -Path $dest -Recurse | Select-Object -First 30
            exit 1
          }
          $dir = $bat.DirectoryName
          "CODE_SIGN_TOOL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CodeSignTool ready at $dir"

      - name: Build
        shell: bash
        env:
          # Mac signing + notarisation. CSC_LINK is a Developer ID .p12; it must
          # NOT reach the Windows job (it would try to sign the exe with it and
          # fail), so it's gated on the mac matrix leg. APPLE_* are read by
          # electron-builder's notarize step and ignored elsewhere.
          CSC_LINK: ${{ matrix.artifact == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.artifact == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.artifact == 'mac' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing. Read by the electron-builder sign hook
          # (build/win-sign.cjs) on the win leg; empty on mac so the hook is
          # never invoked there. CODE_SIGN_TOOL_DIR is exported above.
          WINDOWS_SIGN_USER: ${{ matrix.artifact == 'win' && secrets.WINDOWS_SIGN_USER || '' }}
          WINDOWS_SIGN_PASSWORD: ${{ matrix.artifact == 'win' && secrets.WINDOWS_SIGN_PASSWORD || '' }}
          WINDOWS_SIGN_TOTP_SECRET: ${{ matrix.artifact == 'win' && secrets.WINDOWS_SIGN_TOTP_SECRET || '' }}
          WINDOWS_SIGN_CREDENTIAL_ID: ${{ matrix.artifact == 'win' && secrets.WINDOWS_SIGN_CREDENTIAL_ID || '' }}
        # Apple's notarisation service is a third party in the middle of every
        # Mac release and it is not always well. On v1.1.7 the arm64 build
        # notarised fine and the x64 build came back with an empty response
        # ("Failed with unexpected result:"), which failed the job, skipped the
        # release, and shipped nothing. Re-running the identical commit passed.
        #
        # So the Mac leg gets one automatic retry. Windows signing is a
        # different service and has not shown this, so it stays single-shot —
        # a retry there would just hide a real signing failure for longer.
        run: |
          # NB: Actions runs bash with -eo pipefail, so this must be a real `if`.
          # A `[ ... ] && ATTEMPTS=2` one-liner returns 1 on the Windows leg and
          # would kill the step before it built anything.
          ATTEMPTS=1
          if [ "${{ matrix.artifact }}" = "mac" ]; then
            ATTEMPTS=2
          fi
          for attempt in $(seq 1 $ATTEMPTS); do
            if npm run ${{ matrix.script }}; then
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "::warning::Build attempt $attempt failed. On macOS this is usually Apple notarisation returning nothing. Retrying once before failing the release."
              sleep 45
            fi
          done
          echo "::error::Build failed after $ATTEMPTS attempt(s)."
          exit 1

      # Hard gate: never let an unsigned (or wrongly-signed) Windows installer
      # reach the release job. electron-builder already fails if the sign hook
      # throws; this catches the "built but not properly signed" case too.
      - name: Verify Windows installer is signed (Windows signing)
        if: matrix.artifact == 'win'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'No Setup.exe found in dist'; exit 1 }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "File:   $($exe.FullName)"
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Installer signature status is '$($sig.Status)', expected 'Valid'"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'Mike Rhodes') {
            Write-Error "Unexpected signer: $($sig.SignerCertificate.Subject)"
            exit 1
          }
          Write-Host 'OK: installer is validly signed by Mike Rhodes'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: brain-sync-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.yml
            artifacts/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false

      # Publish the FULL release to the PUBLIC downloads repo. Two audiences in one
      # release: (1) the AUTO-UPDATE FEED — since v1.0.0 every installed app's baked
      # app-update.yml points at this repo, so electron-updater needs the original
      # version-named installers plus latest*.yml + *.blockmap here (this is what lets
      # the source repo go private without breaking updates); (2) the WEBSITE —
      # ads2ai.com/downloads links to
      # agency-brain-downloads/releases/latest/download/<stable-name>, so the stable,
      # version-free copies keep the site on the newest build with zero manual action.
      # It fails the build loudly if it can't publish, so a stale feed or download page
      # can never hide behind a green release.
      # Needs DOWNLOADS_REPO_TOKEN: a fine-grained PAT with contents:write on
      # 8020brain/agency-brain-downloads (the default GITHUB_TOKEN is scoped to THIS
      # repo only and cannot write to another repo).
      - name: Publish feed + installers to the public downloads repo
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DOWNLOADS_REPO_TOKEN is not set. Create a fine-grained PAT with contents:write on 8020brain/agency-brain-downloads and add it as the DOWNLOADS_REPO_TOKEN secret on this repo."
            exit 1
          fi
          DST=8020brain/agency-brain-downloads
          TAG=${GITHUB_REF_NAME}
          arm=$(ls artifacts/*-arm64.dmg 2>/dev/null | head -1 || true)
          intel=$(ls artifacts/*.dmg 2>/dev/null | grep -v -- '-arm64' | head -1 || true)
          exe=$(ls artifacts/*Setup.exe 2>/dev/null | head -1 || true)
          if [ -z "$arm" ] || [ -z "$intel" ] || [ -z "$exe" ]; then
            echo "::error::Missing an installer (arm='$arm' intel='$intel' exe='$exe')."; ls -la artifacts/; exit 1
          fi
          # Feed files: the update feed is only complete with latest*.yml + blockmaps.
          ls artifacts/*.yml >/dev/null 2>&1 || { echo "::error::No latest*.yml feed files in artifacts."; ls -la artifacts/; exit 1; }
          mkdir -p out
          cp "$arm"   out/Agency-Brain-mac-arm64.dmg
          cp "$intel" out/Agency-Brain-mac-intel.dmg
          cp "$exe"   out/Agency-Brain-Setup.exe
          ls -la out/
          if ! gh release view "$TAG" -R "$DST" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$DST" --latest \
              --title "Agency Brain ${TAG#v}" \
              --notes "Release of ${GITHUB_REPOSITORY} ${TAG} (auto-update feed + website installers)."
          fi
          # Original version-named artifacts (the auto-update feed)...
          gh release upload "$TAG" -R "$DST" artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.yml artifacts/*.blockmap --clobber
          # ...plus the stable-name copies for ads2ai.com/downloads.
          gh release upload "$TAG" -R "$DST" out/* --clobber
          gh release edit "$TAG" -R "$DST" --latest
          echo "Published $TAG -> https://github.com/$DST/releases/tag/$TAG"
