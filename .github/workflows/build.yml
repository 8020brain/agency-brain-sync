name: Build and release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: mac
          - os: windows-latest
            script: build:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Build
        env:
          # Mac signing + notarisation. CSC_LINK is a Developer ID .p12; it must
          # NOT reach the Windows job (it would try to sign the exe with it and
          # fail), so it's gated on the mac matrix leg. APPLE_* are read by
          # electron-builder's notarize step and ignored elsewhere.
          CSC_LINK: ${{ matrix.artifact == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.artifact == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.artifact == 'mac' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: brain-sync-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.yml
            artifacts/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false

      # Mirror the installers to the PUBLIC downloads repo under stable, version-free
      # filenames. ads2ai.com/downloads links to
      # agency-brain-downloads/releases/latest/download/<stable-name>, so this keeps the
      # site on the newest build with zero manual action. This replaces the old
      # hand-run tools/mirror-agency-release.cjs (which got skipped for v0.8.48–.51 and
      # left the site stuck on v0.8.47). It fails the build loudly if it can't mirror,
      # so a stale download page can never hide behind a green release again.
      # Needs DOWNLOADS_REPO_TOKEN: a fine-grained PAT with contents:write on
      # 8020brain/agency-brain-downloads (the default GITHUB_TOKEN is scoped to THIS
      # repo only and cannot write to another repo).
      - name: Mirror installers to the public downloads repo
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DOWNLOADS_REPO_TOKEN is not set. Create a fine-grained PAT with contents:write on 8020brain/agency-brain-downloads and add it as the DOWNLOADS_REPO_TOKEN secret on this repo."
            exit 1
          fi
          DST=8020brain/agency-brain-downloads
          TAG=${GITHUB_REF_NAME}
          arm=$(ls artifacts/*-arm64.dmg 2>/dev/null | head -1 || true)
          intel=$(ls artifacts/*.dmg 2>/dev/null | grep -v -- '-arm64' | head -1 || true)
          exe=$(ls artifacts/*Setup.exe 2>/dev/null | head -1 || true)
          if [ -z "$arm" ] || [ -z "$intel" ] || [ -z "$exe" ]; then
            echo "::error::Missing an installer (arm='$arm' intel='$intel' exe='$exe')."; ls -la artifacts/; exit 1
          fi
          mkdir -p out
          cp "$arm"   out/Agency-Brain-mac-arm64.dmg
          cp "$intel" out/Agency-Brain-mac-intel.dmg
          cp "$exe"   out/Agency-Brain-Setup.exe
          ls -la out/
          if gh release view "$TAG" -R "$DST" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$DST" out/* --clobber
            gh release edit "$TAG" -R "$DST" --latest
          else
            gh release create "$TAG" -R "$DST" --latest \
              --title "Agency Brain ${TAG#v}" \
              --notes "Mirror of ${GITHUB_REPOSITORY} ${TAG}." \
              out/Agency-Brain-Setup.exe out/Agency-Brain-mac-arm64.dmg out/Agency-Brain-mac-intel.dmg
          fi
          echo "Mirrored $TAG -> https://github.com/$DST/releases/tag/$TAG"
