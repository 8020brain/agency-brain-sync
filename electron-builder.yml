appId: com.8020brain.agencybrain
productName: Agency Brain
copyright: Copyright (c) 2026 8020brain

# Auto-update feed. agency-brain-sync is a PUBLIC repo, so electron-updater can
# read its releases with no token. This bakes app-update.yml into the app and
# makes the build emit latest-mac.yml / latest.yml + .blockmap files (uploaded
# to the release by CI). Builds use `--publish never`; CI does the upload.
publish:
  provider: github
  owner: 8020brain
  repo: agency-brain-sync

directories:
  output: dist
  buildResources: build

# Files to include in the packaged app
files:
  - main.js
  - preload.js
  - src/**/*
  - watcher/**/*
  - assets/**/*
  - command-centre/**/*
  - node_modules/**/*
  - package.json

# The embedded Command Centre server is spawned as a real child node process
# (main.js -> spawn(execPath, [command-centre/server.cjs])). Files inside
# app.asar can't be spawned, so unpack the whole folder to disk.
asarUnpack:
  - command-centre/**/*

# Mac
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
  icon: assets/brain-1024.png  # crisp 1024 (nearest-neighbour from the 32px source); 512 was a blurry smooth upscale
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "Michael Rhodes (J83Q25362G)"  # no "Developer ID Application:" prefix — electron-builder adds it
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: J83Q25362G
  extendInfo:
    LSUIElement: 1   # menu bar only, no dock icon

dmg:
  title: Agency Brain ${version}
  iconSize: 96
  window:
    width: 540
    height: 360

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  publisherName: 8020brain

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Agency Brain
  artifactName: Agency Brain Setup.${ext}
