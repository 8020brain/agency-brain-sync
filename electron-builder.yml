appId: com.8020brain.agencybrain
productName: Agency Brain
copyright: Copyright (c) 2026 8020brain

# Auto-update feed. agency-brain-sync is a PUBLIC repo, so electron-updater can
# read its releases with no token. This bakes app-update.yml into the app and
# makes the build emit latest-mac.yml / latest.yml + .blockmap files (uploaded
# to the release by CI). Builds use `--publish never`; CI does the upload.
publish:
  provider: github
  owner: 8020brain
  repo: agency-brain-sync

directories:
  output: dist
  buildResources: build

# Files to include in the packaged app
files:
  - main.js
  - preload.js
  - lib/**/*
  - src/**/*
  - watcher/**/*
  - assets/**/*
  - command-centre/**/*
  - node_modules/**/*
  - package.json

# The embedded Command Centre server is spawned as a real child node process
# (main.js -> spawn(execPath, [command-centre/server.cjs])). Files inside
# app.asar can't be spawned, so unpack the whole folder to disk.
asarUnpack:
  - command-centre/**/*

# Mac
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # electron-updater's MacUpdater applies updates from a .zip (Squirrel.Mac
    # cannot apply a dmg). The zip is what latest-mac.yml lists first and what
    # auto-update downloads. Without it the updater throws "ZIP file not
    # provided" and never fires update-downloaded. The dmg stays for first-run
    # manual installs.
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
  icon: assets/brain-1024.png  # crisp 1024 (nearest-neighbour from the 32px source); 512 was a blurry smooth upscale
  # No spaces — GitHub turns spaces into dots in asset names, which would break
  # the latest-mac.yml update-feed URLs. Keeps generated file = asset = feed url.
  artifactName: Agency-Brain-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "Michael Rhodes (J83Q25362G)"  # no "Developer ID Application:" prefix — electron-builder adds it
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: J83Q25362G
  extendInfo:
    LSUIElement: 1   # menu bar only, no dock icon

dmg:
  title: Agency Brain ${version}
  iconSize: 96
  window:
    width: 540
    height: 360

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  publisherName: 8020brain

nsis:
  # One-click installer so auto-updates install silently and relaunch (matching
  # the Mac zip flow). oneClick:false showed the full "next, next" wizard on every
  # update. perMachine:false keeps it per-user, so silent install needs no UAC.
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Agency Brain
  artifactName: Agency-Brain-Setup.${ext}  # no spaces (same reason as mac.artifactName) so latest.yml resolves
